[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "device-trust-service"
version = "0.9.0b1"
description = "Customer-operated Android device trust verification: key attestation, Play Integrity, signed actions and scans"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=42",
  "fastapi>=0.115",
  "pydantic>=2.8,<3",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
device-trust = "device_trust.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["device_trust"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
