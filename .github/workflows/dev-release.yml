name: Dev pre-release

# Run 19b: a pushed tag v<cyclone.version> (e.g. v0.9.0-dev.1) publishes a GitHub
# *pre-release* with the dev-signed scanner APK, the SDK Maven repository and the build
# evidence. Development builds only: signed with the PUBLIC dev key unless release
# secrets are configured, never device-validated by this workflow.
on:
  push:
    tags: ['v*-dev.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Tag must match the build version
        run: |
          version=$(sed -n 's/^cyclone.version=//p' gradle.properties)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }
      - uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018 cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Test and build
        run: |
          set -o pipefail
          ./gradlew --no-daemon :devicetrust:testDebugUnitTest :scanner:testReleaseUnitTest \
            :scanner:assembleRelease :devicetrust:publishReleasePublicationToLocalBetaRepository 2>&1 | tail -20
      - name: Evidence and signer check
        working-directory: .
        run: |
          set -euo pipefail
          out=android/scanner/build/outputs/apk/release
          aar=android/devicetrust/build/outputs/aar/devicetrust-release.aar
          apksigner="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          python3 -m tools.release.build_evidence --revision "$(git rev-parse HEAD)" \
            --aar "$aar" --apk "$out/scanner-release.apk" --apksigner "$apksigner" > "$out/build-evidence.json"
          python3 -m tools.assurance.artifact_manifest "$out/scanner-release.apk" \
            --revision "$(git rev-parse HEAD)" > "$out/scanner-assurance-manifest.json"
          echo "{\"signing_cert_sha256\": [\"$(cat android/signing/dev-signer.sha256)\"]}" > "$RUNNER_TEMP/dev-policy.json"
          python3 -m tools.release.check_signing "$out/scanner-release.apk" --policy "$RUNNER_TEMP/dev-policy.json" \
            --apksigner "$apksigner" --allow-dev
          version="${GITHUB_REF_NAME#v}"
          cp "$out/scanner-release.apk" "$RUNNER_TEMP/cyclone-scanner-$version.apk"
          (cd android/devicetrust/build && zip -qr "$RUNNER_TEMP/devicetrust-maven-repo-$version.zip" repo)
          cp "$out/build-evidence.json" "$out/scanner-assurance-manifest.json" "$RUNNER_TEMP/"
      - name: Publish pre-release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          cat > "$RUNNER_TEMP/notes.md" <<NOTES
          **Development build: not for production, not device-validated, not certified.**

          - Scanner APK signed with the **public development key** (docs: android/signing/README.md).
            Anyone can sign with that key; never trust it in a production policy.
          - SDK: \`com.devicetrust:devicetrust:$version\` (Maven repository zip).
          - Exact tested revision, digests, toolchain and signer: build-evidence.json.
          - Status of physical and live-Google validation: docs/RUN_19_DEVICE_VALIDATION.md.

          Licensed under Apache-2.0. Play Integrity / Play services dependencies are Google-proprietary.
          NOTES
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --prerelease \
            --title "Cyclone Scan $version (development build)" --notes-file "$RUNNER_TEMP/notes.md" \
            "$RUNNER_TEMP/cyclone-scanner-$version.apk" "$RUNNER_TEMP/devicetrust-maven-repo-$version.zip" \
            "$RUNNER_TEMP/build-evidence.json" "$RUNNER_TEMP/scanner-assurance-manifest.json"
