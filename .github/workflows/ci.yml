name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: device-trust-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native host tests and detector mutations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Parser, raw syscall and sanitizer tests
        run: |
          cmake -S android/devicetrust/src/main/cpp -B /tmp/dtnative -DDT_SANITIZE=ON
          cmake --build /tmp/dtnative
          ctest --test-dir /tmp/dtnative --output-on-failure
      - name: Every disabled detector must fail a test
        run: |
          ulimit -c 0
          for check in $(seq 0 8); do
            cc -std=c11 -Wall -Wextra -Werror -DDT_MUTATE_CHECK=$check \
              -Iandroid/devicetrust/src/main/cpp \
              android/devicetrust/src/main/cpp/dt_checks.c \
              android/devicetrust/src/main/cpp/tests/dt_checks_test.c -o /tmp/dt-mutant
            if /tmp/dt-mutant > /tmp/dt-mutant.log 2>&1; then
              echo "Mutation $check survived"; exit 1
            fi
            echo "Mutation $check rejected by detector assertions"
          done

  service:
    name: Trust service (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test
        run: |
          python -m pip install --disable-pip-version-check -e 'service[test]'
          python -m pytest -q service/tests

  android:
    name: Android client library
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          # The action's default list includes the retired 'tools' package, which
          # current cmdline-tools no longer serve.
          packages: "platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018 cmake;3.22.1"
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Test, lint and assemble
        run: >-
          ./gradlew --no-daemon
          :devicetrust:testDebugUnitTest :devicetrust:lintRelease :devicetrust:assembleRelease
          :scanner:testReleaseUnitTest :scanner:assembleRelease
      - name: Kotlin signal reports pass the server validator
        working-directory: .
        run: |
          for f in android/devicetrust/build/signals-sample.json android/devicetrust/build/signals-sample-unavailable.json; do
            PYTHONPATH=service python3 -c 'import json, sys
          from device_trust.signals import coverage_summary, parse_client_signals
          print(sys.argv[1], coverage_summary(parse_client_signals(json.load(open(sys.argv[1])))))' "$f"
          done
      - name: Verify native ABI packaging and owned code bounds
        working-directory: .
        run: python3 tools/check_native_apk.py
      - name: Upload scanner APK
        uses: actions/upload-artifact@v4
        with:
          name: device-trust-scanner-apk
          path: android/scanner/build/outputs/apk/release/scanner-release.apk
          if-no-files-found: error
